apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mistify-backend
  template:
    metadata:
      labels:
        app: mistify-backend
    spec:
      containers:
        - name: mistify-backend
          image: el24ss/mistify-backend:1.3
          env:
            - name: DB_HOST
              value: "10.10.3.15"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "mistify_user"
            - name: DB_NAME
              value: "mistify_db"
            - name: DB_PASSWORD
              value: "password_user"
          ports:
            - containerPort: 3000