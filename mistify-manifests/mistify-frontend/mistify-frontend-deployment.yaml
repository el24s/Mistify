apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistify-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mistify-frontend
  template:
    metadata:
      labels:
        app: mistify-frontend
    spec:
      containers:
        - name: mistify-frontend
          image: el24ss/mistify-frontend:1.3
          ports:
            - containerPort: 80